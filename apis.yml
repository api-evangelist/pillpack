name: PillPack
description: 'PillPack is a full-service mail-order pharmacy that sorts each customer''s
  medications by date and time, packages them into clearly labeled dose packets, and
  delivers them monthly with automatic refill management. The service coordinates
  directly with prescribing doctors and insurance providers, charges no service fee
  (customers pay only for their medications), and holds URAC Mail Service Pharmacy
  accreditation with NCPDP E-Scribe capabilities out of Manchester, NH. Founded in
  2013 and acquired by Amazon in 2018, PillPack is now operated by the same team of
  licensed pharmacists behind Amazon Pharmacy, which the site increasingly directs
  customers toward for same-day delivery and additional savings. PillPack is a
  consumer-facing pharmacy service with no public developer or API surface.'
